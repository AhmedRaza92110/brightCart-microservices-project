apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: brightcart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/REPO.git
    targetRevision: main
    path: deploy/helm/brightcart
    helm:
      releaseName: brightcart
  destination:
    server: https://kubernetes.default.svc
    namespace: brightcart
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
