apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: brightcart
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/AhmedRaza92110/brightCart-microservices-project.git
    targetRevision: main
    path: deploy/helm/brightcart

  destination:
    server: https://kubernetes.default.svc
    namespace: brightcart

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true