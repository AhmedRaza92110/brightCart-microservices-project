frontend:
  replicas: 1
  image:
    repository: your-dockerhub-username/brightcart-frontend
    tag: latest
    pullPolicy: IfNotPresent
  port: 80

services:
  auth-service:
    replicas: 1
    image:
      repository: your-dockerhub-username/brightcart-auth-service
      tag: latest
      pullPolicy: IfNotPresent
    port: 8001

  profile-service:
    replicas: 1
    image:
      repository: your-dockerhub-username/brightcart-profile-service
      tag: latest
      pullPolicy: IfNotPresent
    port: 8002

  product-service:
    replicas: 1
    image:
      repository: your-dockerhub-username/brightcart-product-service
      tag: latest
      pullPolicy: IfNotPresent
    port: 8003

  order-service:
    replicas: 1
    image:
      repository: your-dockerhub-username/brightcart-order-service
      tag: latest
      pullPolicy: IfNotPresent
    port: 8004

  payment-service:
    replicas: 1
    image:
      repository: your-dockerhub-username/brightcart-payment-service
      tag: latest
      pullPolicy: IfNotPresent
    port: 8005

  message-service:
    replicas: 1
    image:
      repository: your-dockerhub-username/brightcart-message-service
      tag: latest
      pullPolicy: IfNotPresent
    port: 8006

  history-service:
    replicas: 1
    image:
      repository: your-dockerhub-username/brightcart-history-service
      tag: latest
      pullPolicy: IfNotPresent
