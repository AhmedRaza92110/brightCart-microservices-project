{{- $service := index .Values.services "auth-service" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-service
  labels:
    app.kubernetes.io/name: message-service
    {{- include "brightcart.labels" . | nindent 4 }}
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: brightcart
    spec:
      containers:
        - name: message-service
          image: "{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: {{ $service.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: message-service
  labels:
    app.kubernetes.io/name: message-service
    {{- include "brightcart.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: message-service
  ports:
    - name: http
      port: 8006
      targetPort: http
  type: ClusterIP