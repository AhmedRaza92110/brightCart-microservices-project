apiVersion: apps/v1
kind: Deployment
metadata:
  name: brightcart-frontend
  labels:
    app.kubernetes.io/name: brightcart-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: brightcart-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brightcart-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: brightcart-frontend
spec:
  selector:
    app.kubernetes.io/name: brightcart-frontend
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP

