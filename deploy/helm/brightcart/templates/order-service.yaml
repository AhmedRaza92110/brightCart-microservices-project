apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
    {{- include "brightcart.labels" . | nindent 4 }}
spec:
  replicas: {{ (get (get .Values.services "order-service") "replicas") }}
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
    spec:
      containers:
        - name: order-service
          image: "{{ (get (get (get .Values.services "order-service") "image") "repository") }}:{{ (get (get (get .Values.services "order-service") "image") "tag") }}"
          imagePullPolicy: {{ (get (get (get .Values.services "order-service") "image") "pullPolicy") }}
          ports:
            - name: http
              containerPort: {{ (get (get .Values.services "order-service") "port") }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 8004
      targetPort: http
  type: ClusterIP
