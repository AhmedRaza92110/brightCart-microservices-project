services:
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [product-service]
  auth-service:
    build: ./services/auth-service
    ports: ["8001:8001"]
  profile-service:
    build: ./services/profile-service
    ports: ["8002:8002"]
  product-service:
    build: ./services/product-service
    ports: ["8003:8003"]
  order-service:
    build: ./services/order-service
    ports: ["8004:8004"]
  payment-service:
    build: ./services/payment-service
    ports: ["8005:8005"]
  message-service:
    build: ./services/message-service
    ports: ["8006:8006"]
  history-service:
    build: ./services/history-service
    ports: ["8007:8007"]
